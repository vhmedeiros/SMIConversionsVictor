# Caminhos
ffmpeg_path:  "C:\\Sistema\\bin\\ffmpeg.exe"
ffprobe_path: "C:\\Sistema\\bin\\ffprobe.exe"
work_dir:     "D:\\Sistema\\ftp\\work"
output_dir:   "D:\\Sistema\\ftp\\arquivos\\stream"
log_dir:      "D:\\Sistema\\ftp\\logs"

# Segmentação
segment_seconds: 240          # 4 minutos; deve dividir 3600
grid_snap_seconds: 3          # tolerância de encosto na grade (SPEC.md §7.3)

# Watchdog
stall_timeout_seconds: 300    # sem .ts novo por este tempo = travado
backoff_initial_seconds: 2
backoff_max_seconds: 60
orphan_timeout_seconds: 300   # mtime parado = .ts órfão publicável

# Publisher
publish_tick_seconds: 5
max_publish_retries: 3

# Comportamento
pre_create_day_folders: true  # cria pastas do dia às 00:00:05
log_level: "info"             # debug | info | warn | error

channels:
  # av_sync_offset_seconds: correção do offset fixo entre áudio e vídeo. Positivo
  # atrasa o áudio, negativo adianta — não é reencode, só timestamp (DEPLOY.md §9).
  # Histórico 28/09: 1.5 uniforme (campo BOV02) overcorrigiu todos os 8 canais;
  # zerado, e daí testado por canal com sinal. Resultado desse teste com offset 0:
  # Band e Cultura bateram (ficam 0); Record e Globo com áudio levemente atrasado
  # (-0.3); Sbt e TvAssembleia mais atrasados (-0.8); TvCidade e TvTropical ainda
  # não testados (sem sinal na hora), ficam 0 até serem calibrados. Cada canal tem
  # offset próprio de verdade — não uniformizar de novo. Recalibrar por canal
  # conforme necessário (ver §9).
  - name: "Record"
    label: "TV IMPERIAL - AF. TV RECORD - RR"
    url: "http://192.168.1.168/0.m3u8"
    enabled: true
    av_sync_offset_seconds: -0.3

  - name: "Globo"
    label: "TV RORAIMA - AF. GLOBO - RR"
    url: "http://192.168.1.168/2.m3u8"
    enabled: true
    av_sync_offset_seconds: -0.3

  - name: "TvAssembleia"
    label: "TV ASSEMBLEIA - RR"
    url: "http://192.168.1.168/4.m3u8"
    enabled: true
    av_sync_offset_seconds: -0.8

  - name: "Band"
    label: "TV BAND RORAIMA - RR"
    url: "http://192.168.1.168/6.m3u8"
    enabled: true
    av_sync_offset_seconds: 0

  - name: "Sbt"
    label: "TV NORTE / AF. SBT - RR"
    url: "http://192.168.1.168/14.m3u8"
    enabled: true
    av_sync_offset_seconds: -0.8

  - name: "TvCidade"
    label: "TV CIDADE - RR"
    url: "http://192.168.1.168/12.m3u8"
    enabled: true
    av_sync_offset_seconds: 0

  - name: "Cultura"
    label: "TV ATIVA RORAIMA"
    url: "http://192.168.1.168/10.m3u8"
    enabled: true
    av_sync_offset_seconds: 0

  - name: "TvTropical"
    label: "TV TROPICAL RR"
    url: "http://192.168.1.168/8.m3u8"
    enabled: true
    av_sync_offset_seconds: 0
